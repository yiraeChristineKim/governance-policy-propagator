apiVersion: v1
kind: Service
metadata:
  name: propagator-dryrun-service
  namespace: open-cluster-management
spec:
  ports:
  - port: 8090
    protocol: TCP
    targetPort: 8090
  selector:
    name: governance-policy-propagator
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: propagator-dryrun-serving-cert
  namespace: open-cluster-management
spec:
  dnsNames:
  - propagator-dryrun-service.open-cluster-management.svc
  - propagator-dryrun-service.open-cluster-management.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: propagator-dryrun-selfsigned-issuer
  secretName: propagator-dryrun-server-cert
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: propagator-dryrun-selfsigned-issuer
  namespace: open-cluster-management
spec:
  selfSigned: {}
